<div class="chat-widget-container" cdkDrag cdkDragBoundary="#page-content-boundary">
  <div class="chat-window" [class.open]="isOpen" *ngIf="isOpen">
    <div class="chat-header" cdkDragHandle style="cursor: move;">
      <div class="chat-header-content">
        <div class="chat-title">
          <span class="header-avatar">
            <i class="pi pi-comments"></i>
          </span>
          <div class="header-text">
            <span class="title">AI Assistant</span>
            <span class="subtitle"><span class="status-dot"></span>Online</span>
          </div>
        </div>
        <div class="header-actions">
          <button class="header-icon-btn" (click)="clearChat()" *ngIf="messages.length > 0" aria-label="Clear chat"
            title="Clear chat">
            <i class="pi pi-trash"></i>
          </button>
          <button class="header-icon-btn" (click)="navigateToAiAssistant()" aria-label="Open full page"
            title="Open in full page">
            <i class="pi pi-external-link"></i>
          </button>
          <button class="header-icon-btn close-button" (click)="closeChat()" aria-label="Close chat">
            <i class="pi pi-times"></i>
          </button>
        </div>
      </div>
    </div>

    <div class="chat-messages" id="chat-messages">
      <div *ngIf="messages.length === 0" class="empty-state">
        <div class="empty-icon">
          <i class="pi pi-comments"></i>
        </div>
        <p class="empty-title">Ask me anything</p>
        <p class="hint">Leave, payroll, attendance, policies, and more.</p>
      </div>

      <div *ngFor="let message of messages" class="message" [class.user]="message.sender === 'user'"
        [class.ai]="message.sender === 'ai'">
        <div class="message-avatar" *ngIf="message.sender === 'ai'">
          <i class="pi pi-comments"></i>
        </div>
        <div class="message-content">
          <div class="message-text">
            <ng-container *ngIf="message.sender === 'ai'">
              <ng-container *ngFor="let part of formatMessage(message.text)">
                <ng-container [ngSwitch]="part.type">
                  <span *ngSwitchCase="'text'">{{ part.content }}</span>
                  <br *ngSwitchCase="'linebreak'" />
                  <button *ngSwitchCase="'url'" class="message-link-button" (click)="navigateToUrl(part.url!)"
                    type="button">
                    <i class="pi pi-arrow-up-right"></i>
                    <span>{{ part.content }}</span>
                  </button>
                </ng-container>
              </ng-container>
            </ng-container>
            <span *ngIf="message.sender === 'user'">{{ message.text }}</span>
          </div>
          <div class="message-time">{{ message.timestamp | localizedDate:'h:mm a' }}</div>
        </div>
      </div>

      <div *ngIf="isLoading" class="message ai">
        <div class="message-avatar">
          <i class="pi pi-comments"></i>
        </div>
        <div class="message-content typing-wrap">
          <div class="typing-indicator">
            <span></span>
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </div>

    <div class="chat-input-container">
      <div class="input-shell">
        <textarea class="chat-input" [(ngModel)]="newMessage" (keydown)="onKeyPress($event)"
          placeholder="Message AI Assistant..." rows="1" [disabled]="isLoading">
        </textarea>
        <button class="send-button" (click)="sendMessage()" [disabled]="!newMessage.trim() || isLoading"
          [class.active]="newMessage.trim()" aria-label="Send message">
          <i class="pi" [ngClass]="isLoading ? 'pi-spin pi-spinner' : 'pi-send'"></i>
        </button>
      </div>
    </div>
  </div>

  <button class="chat-button" cdkDragHandle (click)="toggleChat()" [class.open]="isOpen" aria-label="Open chat">
    <i class="pi pi-comments" *ngIf="!isOpen"></i>
    <i class="pi pi-times" *ngIf="isOpen"></i>
  </button>
</div>
