<div class="notification-dialogue" *ngIf="isOpen" (click)="$event.stopPropagation()">
  <div class="header">
    <span>Notifications</span>
    <button mat-button (click)="markAllAsRead()" [disabled]="unreadCount === 0">
      Mark all as read
    </button>
  </div>
  <mat-divider></mat-divider>
  <div class="notification-list" *ngIf="notification.length > 0; else noNotifications">
    <div *ngFor="let n of notification"
         class="notification-item"
         [class.unread]="!n.isRead"
         (click)="onNotificationClick(n)">
      <mat-icon class="notification-icon">notifications</mat-icon>
      <div class="content">
        <div class="title">{{ n.title }}</div>
        <div class="message" [innerHTML]="getSafeHtml(n.message)"></div>
        <div class="time">{{ n.createdAt | date:'dd-MM-yyyy HH:mm' }}</div>

        <!-- ✅ CHANGED: Show buttons only when requestStatus is 'pending' -->
        <div *ngIf="n.notificationType === 'Request' && n.moduletype && n.requestStatus === 'pending'"
             class="action-buttons">
          <button mat-button color="primary"
                  (click)="handleAction(n, 'accept'); $event.stopPropagation()">
            Accept
          </button>
          <button mat-button color="warn"
                  (click)="handleAction(n, 'reject'); $event.stopPropagation()">
            Reject
          </button>
        </div>

        <!-- ✅ NEW: Show status badge when already actioned -->
        <div *ngIf="n.notificationType === 'Request' && n.moduletype && n.requestStatus && n.requestStatus !== 'pending'"
             class="status-badge" [ngClass]="n.requestStatus.toLowerCase()">
          <mat-icon>{{ n.requestStatus === 'approved' ? 'check_circle' : 'cancel' }}</mat-icon>
          {{ n.requestStatus === 'approved' ? 'Approved' : 'Rejected' }}
        </div>

      </div>
    </div>
  </div>
  <ng-template #noNotifications>
    <div class="no-notifications">No notifications</div>
  </ng-template>
</div>
