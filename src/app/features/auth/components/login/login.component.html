<div class="login-page">

  <!-- ══ LEFT: Slideshow ══ -->
  <div class="left-panel">

    <div class="slideshow-images">
      <div class="slide-img"
           *ngFor="let slide of slides; let i = index"
           [class.active]="i === activeSlide"
           [class.prev]="i === prevSlide">
        <img [src]="slide.image" [alt]="slide.title" />
      </div>
    </div>

    <div class="slideshow-text">
      <div class="slide-text-item"
           *ngFor="let slide of slides; let i = index"
           [class.active]="i === activeSlide">
        <h3 class="slide-title">{{ slide.title }}</h3>
        <p class="slide-desc">{{ slide.description }}</p>
      </div>
    </div>

    <div class="slide-dots">
      <span class="dot"
            *ngFor="let slide of slides; let i = index"
            [class.active]="i === activeSlide"
            (click)="goToSlide(i)">
      </span>
    </div>

  </div>

  <!-- ══ DIVIDER ══ -->
  <div class="panel-divider"></div>

  <!-- ══ RIGHT: Plain login — NO card, NO box ══ -->
  <div class="right-panel">
    <div class="form-wrapper">

      <!-- Brand -->
      <div class="login-brand" (click)="onsignup()">
        <img src="../../../../../assets/Brisk.jpeg" alt="BriskPeople" class="brand-logo" />
        <span class="brand-name">Brisk People</span>
      </div>

      <!-- Title -->
      <div class="login-header">
        <h2 class="login-title">Welcome Back</h2>
        <p class="login-subtitle">Sign in to your account to continue</p>
      </div>

      <!-- Form — no card wrapping this -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>

        <!-- Email -->
        <div class="field-group">
          <label class="field-label">Email Address <span class="required">:</span></label>
          <mat-form-field appearance="outline" class="form-field">
            
            <input matInput type="email" formControlName="email"
                   autocomplete="email" />
            <mat-error *ngIf="isFieldInvalid('email')">{{ getErrorMessage('email') }}</mat-error>
          </mat-form-field>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label">Password <span class="required">:</span></label>
          <mat-form-field appearance="outline" class="form-field">
            
            <input matInput [type]="hidePassword ? 'password' : 'text'"
                   formControlName="password" autocomplete="current-password"/>
            <button mat-icon-button matSuffix type="button"
                    (click)="togglePasswordVisibility()">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="isFieldInvalid('password')">{{ getErrorMessage('password') }}</mat-error>
          </mat-form-field>
        </div>

        <!-- Remember + Forgot -->
        <div class="form-options">
          <mat-checkbox formControlName="rememberMe" class="remember-checkbox">
            Remember me
          </mat-checkbox>
          <button type="button" mat-button class="forgot-link" (click)="onForgotPassword()">
            Forgot Password?
          </button>
        </div>

        <!-- Sign In -->
        <button type="submit" class="login-button" [disabled]="isLoading">
          <mat-spinner *ngIf="isLoading" diameter="16" class="btn-spinner"></mat-spinner>
          <span>{{ isLoading ? 'Signing In...' : 'Sign In' }}</span>
        </button>

        <!-- Sign up -->
        <p class="signup-text">
          Don't have an account?
          <button type="button" (click)="onsignup()" class="signup-link">Sign up</button>
        </p>

      </form>
    </div>
  </div>

</div>
