<div class="reset-page">

  <!-- ══ LEFT: Slideshow (identical to login) ══ -->
  <div class="left-panel">

    <div class="slideshow-images">
      <div class="slide-img"
           *ngFor="let slide of slides; let i = index"
           [class.active]="i === activeSlide"
           [class.prev]="i === prevSlide">
        <img [src]="slide.image" [alt]="slide.title" />
      </div>
    </div>

    <div class="slideshow-text">
      <div class="slide-text-item"
           *ngFor="let slide of slides; let i = index"
           [class.active]="i === activeSlide">
        <h3 class="slide-title">{{ slide.title }}</h3>
        <p class="slide-desc">{{ slide.description }}</p>
      </div>
    </div>

    <div class="slide-dots">
      <span class="dot"
            *ngFor="let slide of slides; let i = index"
            [class.active]="i === activeSlide"
            (click)="goToSlide(i)">
      </span>
    </div>

  </div>

  <!-- ══ DIVIDER ══ -->
  <div class="panel-divider"></div>

  <!-- ══ RIGHT: Plain reset-password — NO card, NO box ══ -->
  <div class="right-panel">
    <div class="form-wrapper">

      <!-- Brand -->
      <div class="login-brand" (click)="onsignup()">
        <img src="../../../../../assets/Brisk.jpeg" alt="BriskPeople" class="brand-logo" />
        <span class="brand-name">Brisk People</span>
      </div>

      <!-- Title -->
      <div class="login-header">
        <h2 class="login-title">Reset Your Password</h2>
        <p class="login-subtitle">Choose a strong password to keep your account secure.</p>
      </div>

      <!-- Form -->
      <form [formGroup]="resetPasswordForm" (ngSubmit)="onSubmit()" class="login-form" novalidate>

        <!-- New Password -->
        <div class="field-group">
          <label class="field-label">New Password <span class="required">:</span></label>
          <mat-form-field appearance="outline" class="form-field">
            <input matInput
                   [type]="hidePassword ? 'password' : 'text'"
                   formControlName="password"
                   autocomplete="new-password" />
            <button mat-icon-button matSuffix type="button"
                    (click)="hidePassword = !hidePassword">
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="isFieldInvalid('password')">{{ getErrorMessage('password') }}</mat-error>
          </mat-form-field>
        </div>

        <!-- Confirm Password -->
        <div class="field-group">
          <label class="field-label">Confirm Password <span class="required">:</span></label>
          <mat-form-field appearance="outline" class="form-field">
            <input matInput
                   [type]="hideConfirmPassword ? 'password' : 'text'"
                   formControlName="confirmPassword"
                   autocomplete="new-password" />
            <button mat-icon-button matSuffix type="button"
                    (click)="hideConfirmPassword = !hideConfirmPassword">
              <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
            <mat-error *ngIf="isFieldInvalid('confirmPassword') || hasMismatchError()">
              {{ getErrorMessage('confirmPassword') }}
            </mat-error>
          </mat-form-field>
        </div>

        <!-- Reset Password button -->
        <button type="submit" class="login-button" [disabled]="resetPasswordForm.invalid || isLoading">
          <mat-spinner *ngIf="isLoading" diameter="16" class="btn-spinner"></mat-spinner>
          <span>{{ isLoading ? 'Resetting...' : 'Reset Password' }}</span>
        </button>

        <!-- Back to login -->
        <p class="signup-text">
          Remember your password?
          <button type="button" routerLink="/login" class="signup-link">Sign In</button>
        </p>

      </form>

    </div>
  </div>

</div>
