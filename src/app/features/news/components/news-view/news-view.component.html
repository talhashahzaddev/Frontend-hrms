<!-- ================= LOADING & ERROR STATES ================= -->
<ng-template #loadingOrError>
  <div class="ts-page-layout">
    <div class="ts-loading-state" *ngIf="isLoading">
      <mat-spinner diameter="40"></mat-spinner>
      <p>Loading article...</p>
    </div>
    <div *ngIf="error && !isLoading" class="ts-error-state">
      <mat-icon>error_outline</mat-icon>
      <h3>Error Loading Article</h3>
      <p>{{ error }}</p>
      <button mat-stroked-button class="btn-cancel" (click)="goBack()">Back to Dashboard</button>
    </div>
  </div>
</ng-template>

<!-- ================= MAIN CONTENT ================= -->
<div class="ts-page-layout" *ngIf="!isLoading && news; else loadingOrError">
  
  <!-- PAGE HEADER -->
  <app-page-header 
    matIcon="article"
    title="News Article" 
    [subtitle]="'Category: ' + (news.category || 'General')">
    
    <div class="page-header-actions">
      <button mat-stroked-button class="btn-cancel" (click)="goBack()">
        <mat-icon>arrow_back</mat-icon> Back to Dashboard
      </button>
    </div>
  </app-page-header>

  <!-- ARTICLE CARD -->
  <div class="ts-card nv-card">
    <div class="nv-hero" *ngIf="news.imageUrl">
      <img [src]="news.imageUrl" [alt]="news.title" class="nv-hero-image" />
    </div>

    <div class="nv-content">
      
      <!-- Badges -->
      <div class="nv-badges">
        <span class="ts-chip" [ngClass]="'ts-chip-' + (news.category.toLowerCase() || 'default')">
          <span class="ts-dot"></span> {{ news.category || 'General' }}
        </span>
        <span class="ts-chip" [ngClass]="news.status === 'Published' ? 'ts-chip-published' : 'ts-chip-draft'">
          <span class="ts-dot"></span> {{ news.status }}
        </span>
      </div>

      <!-- Title -->
      <h1 class="nv-title">{{ news.title }}</h1>

      <!-- Metadata -->
      <div class="nv-metadata">
        <div class="nv-meta-item">
          <mat-icon>person</mat-icon>
          <span>{{ news.authorName || 'Unknown Author' }}</span>
        </div>
        <div class="nv-meta-item" *ngIf="news.publishedAt">
          <mat-icon>event</mat-icon>
          <span>{{ news.publishedAt | localizedDate:'MMM dd, yyyy' }}</span>
        </div>
        <div class="nv-meta-item" *ngIf="news.views !== undefined">
          <mat-icon>visibility</mat-icon>
          <span>{{ news.views }} Views</span>
        </div>
      </div>

      <mat-divider class="nv-divider"></mat-divider>

      <!-- Rich Text Body -->
      <div class="nv-body quill-content" [innerHTML]="news.description"></div>
      
    </div>
  </div>

</div>
