<div class="dialog-container">
  <div class="dialog-header">
    <div class="header-left">
      <div class="header-icon">
        <mat-icon>reply</mat-icon>
      </div>
      <div>
        <h2 class="header-title">Reply to Ticket</h2>
        <p class="header-subtitle">Send a message to involved users</p>
      </div>
    </div>
    <button mat-icon-button mat-dialog-close class="close-btn" type="button" (click)="closeDialog()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <mat-dialog-content class="dialog-body">
    <form [formGroup]="replyForm" (ngSubmit)="sendReply()">
      <div class="assign-section">
        <div class="assign-section-header">
          <mat-icon>email</mat-icon>
          <span>Message Details</span>
        </div>
        <div class="assign-section-body">

          <!-- From -->
          <div class="assign-field-group">
            <label class="field-label">From</label>
            <mat-form-field appearance="outline" class="mat-field">
              <input matInput formControlName="senderEmail" readonly type="email" style="background:#f8fafc; color:#64748b;">
            </mat-form-field>
          </div>

          <!-- To -->
          <div class="assign-field-group">
            <label class="field-label">To</label>
            <mat-form-field appearance="outline" class="mat-field">
              <input matInput [value]="recipientEmails.join(', ')" readonly type="text" style="background:#f8fafc; color:#64748b;">
            </mat-form-field>
          </div>

          <!-- Subject -->
          <div class="assign-field-group">
            <label class="field-label">Subject</label>
            <mat-form-field appearance="outline" class="mat-field">
              <input matInput formControlName="subject" placeholder="Enter subject (optional)" type="text">
            </mat-form-field>
          </div>

          <!-- Message -->
          <div class="assign-field-group">
            <label class="field-label">Message <span class="required">*</span></label>
            <mat-form-field appearance="outline" class="mat-field">
              <textarea matInput formControlName="message" placeholder="Type your message..." style="min-height: 120px;"></textarea>
              <mat-error *ngIf="replyForm.controls['message'].hasError('required')">Message is required</mat-error>
            </mat-form-field>
          </div>

        </div>
      </div>
    </form>
  </mat-dialog-content>

  <!-- Footer -->
  <div class="dialog-footer">
    <button mat-stroked-button class="btn-cancel" type="button" (click)="closeDialog()" [disabled]="sending">
      Cancel
    </button>
    <button mat-flat-button class="btn-submit" type="button" (click)="sendReply()" [disabled]="sending || replyForm.invalid">
      <mat-icon *ngIf="!sending">send</mat-icon>
      <mat-spinner diameter="16" *ngIf="sending" style="margin-right:8px;"></mat-spinner>
      <span *ngIf="!sending">Send Reply</span>
      <span *ngIf="sending">Sending...</span>
    </button>
  </div>
</div>
