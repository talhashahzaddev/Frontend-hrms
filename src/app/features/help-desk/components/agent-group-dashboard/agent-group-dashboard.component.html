<div class="ts-page-layout">

  <!-- Page Header -->
  <app-page-header matIcon="groups" title="Agent Groups" subtitle="Manage and view all helpdesk agent groups">
    <button actions class="hd-btn-create" *ngIf="hasPermission('Create_AgentGroup_Button')" (click)="openCreateGroupDialog()">
      <mat-icon>add</mat-icon>
      <span>Create Agent Group</span>
    </button>
  </app-page-header>

  <!-- Filters Card -->
  <div class="ts-card" style="padding: 1.25rem 1.5rem;">
    <div class="hd-filter-row">
      <div class="hd-filter-group">
        <label>Search</label>
        <div class="hd-search-wrap">
          <mat-icon class="search-icon">search</mat-icon>
          <input type="text" class="hd-input" placeholder="Search groups..." [formControl]="searchControl" />
        </div>
      </div>
      <div class="hd-filter-group">
        <label>Department</label>
        <select class="hd-select" [formControl]="departmentControl">
          <option value="">-- All --</option>
          <option *ngFor="let dept of departments" [value]="dept.departmentId">
            {{ dept.departmentName }}
          </option>
        </select>
      </div>
    </div>
  </div>

  <!-- Loader -->
  <div *ngIf="loading" class="hd-loader">
    <mat-spinner diameter="36"></mat-spinner>
    <p>Loading groups...</p>
  </div>

  <!-- Table Card -->
  <div class="ts-card" *ngIf="!loading && groups.length > 0" style="overflow: hidden;">
    <div class="hd-table-wrap">
      <table class="hd-table">
        <thead>
          <tr>
            <th>Group Title</th>
            <th>Department</th>
            <th>Members / Agents</th>
            <th>Category</th>
            <th class="text-center">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let group of paginatedGroups">
            <td class="td-title group-link-cell">{{ group.groupTitle }}</td>
            <td>{{ group.departmentName || 'N/A' }}</td>
            <td>
              <ng-container *ngIf="group.employeeNames?.length; else noEmployees">
                <span *ngFor="let name of group.employeeNames; let last = last">
                  {{ name }}<span *ngIf="!last">, </span>
                </span>
              </ng-container>
              <ng-template #noEmployees>
                <span class="td-empty">N/A</span>
              </ng-template>
            </td>
            <td>{{ group.categoryName || 'N/A' }}</td>
            <td class="text-center">
              <button
                *ngIf="hasPermission('VIEW_AGENTGROUP_BUTTON') || hasPermission('EDIT_AGENTGROUP_BUTTON') || hasPermission('DELETE_AGENTGROUP_BUTTON')"
                mat-icon-button
                [matMenuTriggerFor]="actionMenu"
                class="action-menu-btn"
                aria-label="Actions menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              <mat-menu #actionMenu="matMenu">
                <button mat-menu-item *ngIf="hasPermission('VIEW_AGENTGROUP_BUTTON')" (click)="viewGroup(group)">
                  <mat-icon>visibility</mat-icon>
                  <span>View</span>
                </button>
                <button mat-menu-item *ngIf="hasPermission('EDIT_AGENTGROUP_BUTTON')" (click)="editGroup(group)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item *ngIf="hasPermission('DELETE_AGENTGROUP_BUTTON')" (click)="deleteGroup(group)" class="delete-action">
                  <mat-icon>delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <mat-paginator
      [length]="totalGroups"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="pageIndex"
      (page)="onPageChange($event)"
      showFirstLastButtons
      class="hd-paginator">
    </mat-paginator>
  </div>

  <!-- No Data -->
  <div *ngIf="!loading && groups.length === 0" class="ts-card">
    <div class="hd-empty-state">
      <mat-icon>groups</mat-icon>
      <h3>No groups found</h3>
      <p>Create a new agent group to get started</p>
    </div>
  </div>

</div>
