<div class="agent-groups-page">
  
  <!-- ===== MAIN CONTENT CARD ===== -->
  <section class="main-card">
    
    <!-- Header Section with Title only -->
    <div class="card-header">
      <div class="header-text">
        <h1 class="page-title">Agents Groups</h1>
        <p class="page-subtitle">Manage and view all helpdesk agents groups</p>
      </div>
    </div>

    <!-- Filters Section -->
    <div class="filters-section">
      <div class="filters-grid">
        <!-- Search Input -->
        <div class="filter-field">
          <label class="filter-label">Search</label>
          <div class="search-input-wrapper">
            <mat-icon class="search-icon">search</mat-icon>
            <input
              type="text"
              class="filter-input with-icon"
              placeholder="Search groups..."
              [formControl]="searchControl"
            />
          </div>
        </div>

        <!-- Department Dropdown -->
        <div class="filter-field">
          <label class="filter-label">Department</label>
          <select class="filter-select" [formControl]="departmentControl">
            <option value="">--ALL--</option>
            <option *ngFor="let dept of departments" [value]="dept.departmentId">
              {{ dept.departmentName }}
            </option>
          </select>
        </div>

        <!-- Create Button -->
        <div class="filter-field" *ngIf="hasPermission('Create_AgentGroup_Button')" class="add-btn-wrap">
          <button mat-raised-button color="primary" class="add-btn" (click)="openCreateGroupDialog()">
            <mat-icon>add</mat-icon>
            <span>Create Agent Group</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <!-- ===== LOADER ===== -->
  <div *ngIf="loading" class="loader-wrapper">
    <div class="spinner-border"></div>
    <p>Loading groups...</p>
  </div>

  <!-- ===== TABLE SECTION ===== -->
  <section class="table-card" *ngIf="!loading && groups.length > 0">
    <div class="table-wrapper">
      <table class="groups-table">
        <thead>
          <tr>
            <th>GROUP TITLE</th>
            <th>DEPARTMENT</th>
            <th>MEMBERS / AGENTS</th>
            <th>Category</th>
            <th class="text-center">ACTIONS</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let group of paginatedGroups; let even = even; let odd = odd" 
              [class.row-even]="even" 
              [class.row-odd]="odd">
            <td>
              <a href="#" class="group-link">{{ group.groupTitle }}</a>
            </td>
            <td class="td-department">{{ group.departmentName || 'N/A' }}</td>
            <td>
              <div class="members-cell">
                <ng-container *ngIf="group.employeeNames?.length; else noEmployees">
                  <span class="members-text">
                    <span *ngFor="let name of group.employeeNames; let last = last">
                      {{ name }}<span *ngIf="!last">, </span>
                    </span>
                  </span>
                </ng-container>
                <ng-template #noEmployees>
                  <span class="members-text">N/A</span>
                </ng-template>
              </div>
            </td>
              <td class="td-category">{{ group.categoryName || 'N/A' }}</td>
            <td class="text-center">
              <button
                *ngIf="hasPermission('VIEW_AGENTGROUP_BUTTON') || hasPermission('EDIT_AGENTGROUP_BUTTON') || hasPermission('DELETE_AGENTGROUP_BUTTON')"
                mat-icon-button
                [matMenuTriggerFor]="actionMenu"
                class="action-menu-btn"
                aria-label="Actions menu">
                <mat-icon>more_vert</mat-icon>
              </button>
              
              <mat-menu #actionMenu="matMenu" class="custom-action-menu">
                <button mat-menu-item *ngIf="hasPermission('VIEW_AGENTGROUP_BUTTON')" (click)="viewGroup(group)">
                  <mat-icon>visibility</mat-icon>
                  <span>View</span>
                </button>
                <button mat-menu-item *ngIf="hasPermission('EDIT_AGENTGROUP_BUTTON')" (click)="editGroup(group)">
                  <mat-icon>edit</mat-icon>
                  <span>Edit</span>
                </button>
                <button mat-menu-item *ngIf="hasPermission('DELETE_AGENTGROUP_BUTTON')" (click)="deleteGroup(group)" class="delete-action">
                  <mat-icon>delete</mat-icon>
                  <span>Delete</span>
                </button>
              </mat-menu>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- Material Paginator -->
    <mat-paginator
      [length]="totalGroups"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      [pageIndex]="pageIndex"
      (page)="onPageChange($event)"
      showFirstLastButtons
      class="custom-paginator">
    </mat-paginator>
  </section>

  <!-- ===== NO DATA ===== -->
  <div *ngIf="!loading && groups.length === 0" class="no-data">
    <p>No groups found.</p>
  </div>
</div>
