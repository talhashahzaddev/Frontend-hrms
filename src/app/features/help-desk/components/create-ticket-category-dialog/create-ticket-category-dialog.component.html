<div class="ticket-category-modal"> <h2 mat-dialog-title>
    {{ dialogTitle }}
    <button type="button" class="dialog-close-btn" (click)="cancel()" aria-label="Close">
      &times;
    </button>
  </h2>

  <form [formGroup]="categoryForm" (ngSubmit)="submit()">
     </form>
</div>

<form class="ticket-category-modal" [formGroup]="categoryForm" (ngSubmit)="submit()">

  <!-- Category Name -->
  <div class="field-group">
    <label class="field-label">Category Name <span class="required">*</span></label>
    <input
      matInput
      class="field-input"
      formControlName="name"
      placeholder="e.g., Software Issues"
    />
    <span class="field-error" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.hasError('required')">
      Category Name is required
    </span>
    <span class="field-error" *ngIf="categoryForm.get('name')?.touched && categoryForm.get('name')?.hasError('minlength')">
      Minimum 2 characters
    </span>
  </div>

  <!-- Department -->
  <div class="field-group">
    <label class="field-label">Department</label>
    <div class="select-wrapper">
      <mat-select
        class="field-select"
        formControlName="departmentId"
        [disabled]="loadingDepartments"
      >
        <mat-option *ngIf="loadingDepartments" disabled>
          Loading departments...
        </mat-option>
        <mat-option *ngFor="let dept of departments" [value]="dept.departmentId">
          {{ dept.departmentName }}
        </mat-option>
        <mat-option *ngIf="!loadingDepartments && departments.length === 0" disabled>
          No departments available
        </mat-option>
      </mat-select>
    </div>
    <span class="field-error" *ngIf="categoryForm.get('departmentId')?.touched && categoryForm.get('departmentId')?.hasError('required')">
      Department is required
    </span>
  </div>

  <!-- Status -->
  <div class="field-group">
    <label class="field-label">Status</label>
    <div class="select-wrapper">
      <mat-select class="field-select" formControlName="status">
        <mat-option [value]="true">Active</mat-option>
        <mat-option [value]="false">Inactive</mat-option>
      </mat-select>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button type="button" class="btn-cancel" (click)="cancel()">Cancel</button>
    <button type="submit" class="btn-submit" [disabled]="loading">
      {{ submitButtonLabel }}
      <span class="spinner" *ngIf="loading"></span>
    </button>
  </div>

</form>
