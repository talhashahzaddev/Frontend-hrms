<div class="profile-wrapper">
  <div class="profile-content">

    <!-- ── Hero Header ───────────────────────────────────── -->
    <div class="profile-hero">
      <div class="hero-bg-layer"></div>
      <div class="hero-inner">
        <!-- Icon -->
        <div class="avatar-zone">
          <div class="avatar-ring">
            <div class="avatar-circle">
              <mat-icon class="avatar-placeholder-icon">security</mat-icon>
            </div>
          </div>
        </div>

        <!-- Meta -->
        <div class="hero-meta">
          <h1 class="hero-name">Password & Security</h1>
          <p class="hero-email">
            <mat-icon class="hero-email-icon">shield</mat-icon>
            Protect your account
          </p>
          <div class="hero-badges">
            <span class="hero-badge primary">
              <mat-icon>lock</mat-icon>
              Security Settings
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Page title strip ───────────────────────────────── -->
    <div class="page-strip">
      <div class="page-strip-inner">
        <h2 class="page-strip-title">Change Password</h2>
        <p class="page-strip-sub">Ensure your account is using a long, random password to stay secure.</p>
      </div>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()" novalidate>

      <!-- ── Password Fields ─────────────────────────────── -->
      <div class="section-card">
        <div class="section-head">
          <div class="section-icon-wrap indigo">
            <mat-icon>password</mat-icon>
          </div>
          <div>
            <h3 class="section-title">Update Password</h3>
            <p class="section-sub">Enter your current password to make changes</p>
          </div>
        </div>

        <div class="fields-grid single-col-grid">
          
          <!-- Current Password -->
          <div class="field-group">
            <label class="field-label">Current Password</label>
            <div class="field-input-wrap">
              <mat-icon class="field-icon">lock</mat-icon>
              <input class="field-input" 
                     formControlName="currentPassword" 
                     [type]="hideCurrentPassword ? 'password' : 'text'"
                     placeholder="Enter current password" />
              <button class="pwd-toggle-btn" type="button" (click)="hideCurrentPassword = !hideCurrentPassword" tabindex="-1">
                <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </div>
          </div>

          <!-- New Password -->
          <div class="field-group">
            <label class="field-label">New Password</label>
            <div class="field-input-wrap">
              <mat-icon class="field-icon">lock_outline</mat-icon>
              <input class="field-input" 
                     formControlName="newPassword" 
                     [type]="hideNewPassword ? 'password' : 'text'"
                     placeholder="Enter new password" />
              <button class="pwd-toggle-btn" type="button" (click)="hideNewPassword = !hideNewPassword" tabindex="-1">
                <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </div>
          </div>

          <!-- Confirm Password -->
          <div class="field-group">
            <label class="field-label">Confirm New Password</label>
            <div class="field-input-wrap">
              <mat-icon class="field-icon">lock_reset</mat-icon>
              <input class="field-input" 
                     formControlName="confirmPassword" 
                     [type]="hideConfirmPassword ? 'password' : 'text'"
                     placeholder="Confirm new password" />
              <button class="pwd-toggle-btn" type="button" (click)="hideConfirmPassword = !hideConfirmPassword" tabindex="-1">
                <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
              </button>
            </div>
          </div>

        </div>
      </div>

      <!-- ── Action Bar ───────────────────────────────────────── -->
      <div class="action-bar">
        <button class="btn-save" type="submit" [disabled]="passwordForm.invalid || isPasswordLoading">
          <ng-container *ngIf="isPasswordLoading; else saveLabel">
            <span class="btn-spinner"></span>
            Updating...
          </ng-container>
          <ng-template #saveLabel>
            <mat-icon>save</mat-icon>
            Update Password
          </ng-template>
        </button>
      </div>

    </form>
  </div>
</div>
