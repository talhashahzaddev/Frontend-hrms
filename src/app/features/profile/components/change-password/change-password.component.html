
<div class="profile-container">
  <div class="page-header">
    <div class="header-content">
      <h1 class="page-title">Change Password</h1>
      <p class="page-subtitle">Ensure your account is using a long, random password to stay secure.</p>
    </div>
  </div>

  <mat-card class="profile-card">
    <form [formGroup]="passwordForm" (ngSubmit)="onChangePassword()" novalidate>
      <div class="form-grid">
        
        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Current Password</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput 
                 formControlName="currentPassword" 
                 [type]="hideCurrentPassword ? 'password' : 'text'"
                 placeholder="Enter current password">
          <button mat-icon-button matSuffix type="button" (click)="hideCurrentPassword = !hideCurrentPassword">
            <mat-icon>{{ hideCurrentPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>New Password</mat-label>
          <mat-icon matPrefix>lock_outline</mat-icon>
          <input matInput 
                 formControlName="newPassword" 
                 [type]="hideNewPassword ? 'password' : 'text'"
                 placeholder="Enter new password">
          <button mat-icon-button matSuffix type="button" (click)="hideNewPassword = !hideNewPassword">
            <mat-icon>{{ hideNewPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="form-field">
          <mat-label>Confirm New Password</mat-label>
          <mat-icon matPrefix>lock_reset</mat-icon>
          <input matInput 
                 formControlName="confirmPassword" 
                 [type]="hideConfirmPassword ? 'password' : 'text'"
                 placeholder="Confirm new password">
          <button mat-icon-button matSuffix type="button" (click)="hideConfirmPassword = !hideConfirmPassword">
            <mat-icon>{{ hideConfirmPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

      </div>

      <div class="form-actions">
        <button mat-flat-button type="submit" [disabled]="passwordForm.invalid || isPasswordLoading" class="save-button">
          <mat-spinner *ngIf="isPasswordLoading" diameter="20" style="display: inline-block; margin-right: 8px;"></mat-spinner>
          {{ isPasswordLoading ? 'Updating...' : 'Update Password' }}
        </button>
      </div>
    </form>
  </mat-card>
</div>
