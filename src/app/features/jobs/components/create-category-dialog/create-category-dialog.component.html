<div class="modal-container">

  <header class="modal-header">
    <div class="header-content">
      <div class="icon-wrapper">
        <mat-icon class="header-icon">category</mat-icon>
      </div>
      <h2>Create Question Category</h2>
    </div>
    <div class="header-actions">
      <button mat-icon-button (click)="close()" class="close-btn" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </header>

  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-layout">
      
      <div class="form-section">
        <div class="form-row">
          <div class="form-group full-width">
            <label class="form-label required">Category Name</label>
            <mat-form-field appearance="outline" class="w-100 hrms-form-field">
              <input matInput formControlName="name" placeholder="e.g. Frontend Engineering, Behavioral">
              <mat-error *ngIf="form.get('name')?.hasError('required')">Name is required</mat-error>
              <mat-error *ngIf="form.get('name')?.hasError('maxlength')">Max 200 characters allowed</mat-error>
            </mat-form-field>
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group full-width">
            <label class="form-label">Description</label>
            <mat-form-field appearance="outline" class="w-100 hrms-form-field">
              <textarea matInput formControlName="description" rows="3" placeholder="Brief description of this category"></textarea>
              <mat-error *ngIf="form.get('description')?.hasError('maxlength')">Max 500 characters allowed</mat-error>
            </mat-form-field>
          </div>
        </div>
      </div>

    </form>
  </div>

  <footer class="modal-footer">
    <button mat-button (click)="close()" class="btn-cancel" [disabled]="isSubmitting">Cancel</button>
    <button mat-flat-button color="primary" class="btn-primary" 
            [disabled]="form.invalid || isSubmitting" 
            (click)="onSubmit()">
      <span *ngIf="!isSubmitting">Save Category</span>
      <mat-spinner *ngIf="isSubmitting" diameter="20" class="btn-spinner"></mat-spinner>
    </button>
  </footer>

</div>
