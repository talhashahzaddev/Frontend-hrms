<div class="modal-container">

  <header class="modal-header">
    <div class="header-content">
      <div class="icon-wrapper">
        <mat-icon class="header-icon">category</mat-icon>
      </div>
      <h2>Create Question Category</h2>
    </div>
    <div class="header-actions">
      <button mat-icon-button (click)="close()" class="close-btn" aria-label="Close dialog">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </header>

  <div class="modal-body">
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-layout">
      
      <div class="form-section">
        <div class="form-row">
          <div class="form-group full-width">
            <label class="form-label required">Category Name</label>
            <input type="text" class="custom-input" formControlName="name" placeholder="e.g. Frontend Engineering, Behavioral">
            <div class="error-text" *ngIf="form.get('name')?.hasError('required') && form.get('name')?.touched">Name is required</div>
            <div class="error-text" *ngIf="form.get('name')?.hasError('maxlength') && form.get('name')?.touched">Max 200 characters allowed</div>
          </div>
        </div>
      </div>

    </form>
  </div>

  <footer class="modal-footer">
    <button mat-button (click)="close()" class="btn-cancel" [disabled]="isSubmitting">Cancel</button>
    <button mat-flat-button color="primary" class="btn-primary" 
            [disabled]="form.invalid || isSubmitting" 
            (click)="onSubmit()">
      <span *ngIf="!isSubmitting">Save Category</span>
      <mat-spinner *ngIf="isSubmitting" diameter="20" class="btn-spinner"></mat-spinner>
    </button>
  </footer>

</div>
