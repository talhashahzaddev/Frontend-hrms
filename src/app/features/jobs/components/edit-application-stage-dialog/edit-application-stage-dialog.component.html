<div class="dialog-header">
  <h2 mat-dialog-title>
    <mat-icon>{{ data.mode === 'create' ? 'add' : 'edit' }}</mat-icon>
    {{ data.mode === 'create' ? 'Add stage' : 'Edit stage' }} — {{ stageName || 'Stage' }}
  </h2>
  <button mat-icon-button mat-dialog-close class="close-button">
    <mat-icon>close</mat-icon>
  </button>
</div>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="form" class="edit-stage-form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Notes</mat-label>
      <textarea matInput formControlName="notes" rows="3" placeholder="Notes for this stage"></textarea>
    </mat-form-field>

    <ng-container *ngIf="showExtraFields">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Type</mat-label>
        <input matInput formControlName="type" placeholder="e.g. Technical, HR" maxlength="50">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Interview date</mat-label>
        <input matInput [matDatepicker]="interviewDatePicker" formControlName="interviewDate" [min]="minInterviewDate"
          placeholder="Select date">
        <mat-datepicker-toggle matIconSuffix [for]="interviewDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #interviewDatePicker></mat-datepicker>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Interview time</mat-label>
        <input matInput type="time" formControlName="interviewTime" [min]="minInterviewTime" placeholder="HH:mm">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Interview place</mat-label>
        <input matInput formControlName="interviewPlace" placeholder="e.g. Room 101, Video Call" maxlength="200">
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Interviewers</mat-label>
        <mat-select formControlName="interviewerIds" multiple placeholder="Select interviewers">
          <mat-option *ngFor="let emp of employees" [value]="emp.employeeId">
            {{ getEmployeeDisplay(emp) }}
          </mat-option>
        </mat-select>
        <mat-spinner *ngIf="employeesLoading" matSuffix diameter="20"></mat-spinner>
      </mat-form-field>
    </ng-container>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-button mat-dialog-close class="cancel-btn">Cancel</button>
  <button mat-flat-button class="save-btn" (click)="save()" [disabled]="saving">
    {{ saving ? 'Saving...' : 'Save' }}
  </button>
</mat-dialog-actions>
