<div class="attendance-dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <h2>{{ title }}</h2>
    <button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="dialog-body" [formGroup]="form">
    <!-- Row 1: Employee & Type -->
    <div class="form-row">
      <div class="form-group">
        <label>Employee</label>
        <select class="form-control" formControlName="employee">
          <option disabled selected value="">Select employee</option>
          <option value="Ali Hassan">Ali Hassan</option>
          <option value="Sara Ahmed">Sara Ahmed</option>
          <option value="Usman Khan">Usman Khan</option>
          <option value="Fatima Malik">Fatima Malik</option>
          <option value="Bilal Raza">Bilal Raza</option>
        </select>
      </div>
      <div class="form-group" *ngIf="data.type === 'overtime'">
        <label>Type</label>
        <select class="form-control" formControlName="type">
          <option value="Regular">Regular</option>
          <option value="Holiday">Holiday</option>
          <option value="Weekend">Weekend</option>
        </select>
      </div>
    </div>

    <!-- Row 3: Hours & Rate -->
    <div class="form-row" *ngIf="data.type === 'overtime'">
      <div class="form-group">
        <label>Hours</label>
        <input type="number" class="form-control" formControlName="hours" placeholder="e.g. 3.5" step="0.5" />
      </div>
      <div class="form-group">
        <label>Rate per hour ({{ currencySymbol() }})</label>
        <input type="number" class="form-control" formControlName="rate" placeholder="e.g. 1200" />
      </div>
    </div>

    <!-- Row 4: Period -->
    <div class="form-group">
      <label>Period</label>
      <select class="form-control" formControlName="period">
        <option disabled selected value="">Select period</option>
        <option value="January 2025">January 2025</option>
        <option value="February 2025">February 2025</option>
        <option value="March 2025">March 2025</option>
        <option value="April 2025">April 2025</option>
      </select>
    </div>

    <!-- Row 4: Amount -->
    <div class="form-group" *ngIf="data.type === 'overtime'">
      <label>Amount ({{ currencySymbol() }})</label>
      <div class="relative">
        <input type="text" class="form-control" formControlName="amount" placeholder="Auto-calculated from Hours × Rate" readonly />
        <div class="suffix-icon">
          <mat-icon>lock</mat-icon>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <button class="cancel-btn" (click)="close()">Cancel</button>
    <button class="save-btn" (click)="save()">Save record</button>
  </div>
</div>
