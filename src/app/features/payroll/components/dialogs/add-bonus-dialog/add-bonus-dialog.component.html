<div class="attendance-dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <h2>{{ dialogTitle }}</h2>
    <button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="dialog-body" [formGroup]="form">
    <!-- Employee -->
    <div class="form-group">
      <label>Employee</label>
      <select class="form-control" formControlName="employee">
        <option value="" disabled selected>Select employee</option>
        @for (employee of employees; track employee) {
          <option [value]="employee">{{ employee }}</option>
        }
      </select>
    </div>

    <!-- Period + Type -->
    <div class="form-row">
      <div class="form-group">
        <label>Payroll Period</label>
        <select class="form-control" formControlName="payrollPeriod">
          <option value="Oct 2023">Oct 2023</option>
          <option value="Nov 2023">Nov 2023</option>
          <option value="Dec 2023">Dec 2023</option>
          <option value="Jan 2024">Jan 2024</option>
        </select>
      </div>
      <div class="form-group">
        <label>Type</label>
        <select class="form-control" formControlName="type">
          <option value="Fixed">Fixed</option>
          <option value="Performance">Performance</option>
          <option value="Festival">Festival</option>
          <option value="Referral">Referral</option>
        </select>
      </div>
    </div>

    <!-- Amount + Status -->
    <div class="form-row">
      <div class="form-group">
        <label>Amount (PKR)</label>
        <input type="number" class="form-control" formControlName="amount" placeholder="e.g. 5000" />
      </div>
      <div class="form-group">
        <label>Status</label>
        <select class="form-control" formControlName="status">
          <option value="Active">Active</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
    </div>

    <!-- Description -->
    <div class="form-group">
      <label>Description</label>
      <textarea rows="3" class="form-control" formControlName="description" placeholder="Add reason or notes" style="height: auto; padding: 0.75rem;"></textarea>
    </div>
  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <button class="cancel-btn" (click)="close()">Cancel</button>
    <button class="save-btn" (click)="save()">{{ submitLabel }}</button>
  </div>
</div>
