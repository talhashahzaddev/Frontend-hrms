<div class="payroll-modal">
  <header class="modal-header">
    <h2>{{ dialogTitle }}</h2>
    <button type="button" aria-label="Close dialog" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </header>

  <form class="modal-body" [formGroup]="form" (ngSubmit)="save()">
    <div class="field full">
      <label>Employee</label>
      <mat-form-field appearance="outline" class="select-field">
        <mat-select formControlName="employee" [panelClass]="'payroll-dialog-select-panel'" placeholder="Select an employee">
          <mat-option value="" disabled>Select an employee</mat-option>
          @for (employee of employees; track employee.name) {
            <mat-option [value]="employee.name">{{ employee.name }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    </div>

    <div class="field">
      <label>Payroll period</label>
      <input type="text" formControlName="payrollPeriod" />
    </div>

    <div class="field">
      <label>Performance ID</label>
      <input type="text" formControlName="performanceId" placeholder="REF-PR-001" />
    </div>

    <div class="field">
      <label>Score 0-100</label>
      <input type="number" min="0" max="100" formControlName="score" placeholder="85" />
    </div>

    <div class="field">
      <label>Rating</label>
      <mat-form-field appearance="outline" class="select-field">
        <mat-select formControlName="rating" [panelClass]="'payroll-dialog-select-panel'">
          <mat-option value="Excellent">Excellent</mat-option>
          <mat-option value="Good">Good</mat-option>
          <mat-option value="Average">Average</mat-option>
          <mat-option value="Below average">Below average</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <div class="field full amount-field">
      <label>Amount PKR</label>
      <div class="amount-wrap">
        <span>Rs.</span>
        <input type="number" min="0" step="0.01" formControlName="amount" placeholder="0.00" />
      </div>
    </div>
  </form>

  <footer class="modal-footer">
    <button type="button" class="btn-cancel" (click)="close()">Cancel</button>
    <button type="button" class="btn-save" (click)="save()">{{ submitLabel }}</button>
  </footer>
</div>
