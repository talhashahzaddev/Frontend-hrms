<div class="attendance-dialog-container">
  <!-- Header -->
  <div class="dialog-header">
    <h2>{{ dialogTitle }}</h2>
    <button class="close-btn" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Body -->
  <div class="dialog-body" [formGroup]="form">
    <!-- Employee -->
    <div class="form-group">
      <label>Employee</label>
      <select class="form-control" formControlName="employeeId">
        <option value="" disabled selected>Select an employee</option>
        @for (employee of employees; track employee.id) {
          <option [value]="employee.id">{{ employee.name }}</option>
        }
      </select>
    </div>

    <!-- Period + Rule -->
    <div class="form-row">
      <div class="form-group">
        <label>Payroll Period</label>
        <select class="form-control" formControlName="periodId">
          <option value="" disabled selected>Select a period</option>
          @for (period of periods; track period.periodId) {
            <option [value]="period.periodId">{{ period.periodName }}</option>
          }
        </select>
      </div>
      <div class="form-group">
        <label>Performance Rule</label>
        <select class="form-control" formControlName="ruleId" (change)="onRuleChange($any($event.target).value)">
          <option [value]="null">None</option>
          @for (rule of rules; track rule.ruleId) {
            <option [value]="rule.ruleId">{{ rule.ruleName }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Score + Rating -->
    <div class="form-row">
      <div class="form-group">
        <label>Score (0-5)</label>
        <input type="number" class="form-control" min="0" max="5" step="0.5" formControlName="score" placeholder="e.g. 4.5" />
      </div>
      <div class="form-group">
        <label>Rating</label>
        <div class="relative">
          <input type="text" class="form-control" formControlName="rating" placeholder="Auto-calculated" readonly />
          <div class="suffix-icon">
            <mat-icon>lock</mat-icon>
          </div>
        </div>
      </div>
    </div>

    <!-- Amount -->
    <div class="form-group">
      <label>Amount ({{ currencySymbol() }})</label>
      <input type="number" class="form-control" min="0" step="0.01" formControlName="amount" placeholder="0.00" />
    </div>
  </div>

  <!-- Footer -->
  <div class="dialog-footer">
    <button class="cancel-btn" (click)="close()">Cancel</button>
    <button class="save-btn" type="button" [disabled]="!canSubmit" (click)="save()">{{ submitLabel }}</button>
  </div>
</div>
