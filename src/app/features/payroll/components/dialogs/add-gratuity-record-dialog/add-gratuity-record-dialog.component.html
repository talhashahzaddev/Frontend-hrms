<div class="gratuity-record-dialog">
  <div class="dialog-header">
    <h2>{{ dialogTitle }}</h2>
    <button type="button" class="icon-btn" aria-label="Close" (click)="close()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="dialog-form">
    <div class="form-grid">
      <label class="field field-span-2">
        <span>Employee</span>
        <select formControlName="employeeId">
          <option value="" disabled>Select an employee...</option>
          @for (employee of employees; track employee.id) {
            <option [value]="employee.id">{{ employee.name }}</option>
          }
        </select>
      </label>

      <label class="field">
        <span>Years worked</span>
        <input type="number" min="0" step="0.1" formControlName="yearsWorked" placeholder="e.g. 5" />
      </label>

      <label class="field">
        <span>Last salary PKR</span>
        <div class="prefix-wrap">
          <strong>PKR</strong>
          <input type="number" min="0" formControlName="lastSalary" placeholder="0" />
        </div>
      </label>

      <label class="field">
        <span>Gratuity amount</span>
        <div class="prefix-wrap">
          <strong>PKR</strong>
          <input type="number" formControlName="gratuityAmount" readonly />
        </div>
      </label>

      <label class="field">
        <span>Status</span>
        <select formControlName="status">
          <option value="calculated">Calculated</option>
          <option value="approved">Approved</option>
          <option value="paid">Paid</option>
        </select>
      </label>

      <label class="field field-span-2">
        <span>Paid date</span>
        <input type="date" formControlName="paidDate" [disabled]="!isPaidStatus" />
      </label>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn ghost" (click)="close()">Cancel</button>
      <button type="submit" class="btn primary">{{ submitLabel }}</button>
    </div>
  </form>
</div>
