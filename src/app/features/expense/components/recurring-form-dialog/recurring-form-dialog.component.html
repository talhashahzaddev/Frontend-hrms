<div class="dialog-header">
  <div class="title-section">
    <div class="icon-wrapper">
      <mat-icon>repeat</mat-icon>
    </div>
    <div>
      <h2 class="title">{{ data.mode === 'create' ? 'Create Recurring Expense' : 'Edit Recurring Expense' }}</h2>
      <p class="subtitle">Set up your automated recurring expense claim</p>
    </div>
  </div>
  <button class="close-btn" (click)="onCancel()">
    <mat-icon>close</mat-icon>
  </button>
</div>

<div class="dialog-content">
  <form [formGroup]="form" class="form-container">
    <div class="form-grid">
      <!-- Category Selection -->
      <div class="form-group full-width">
        <label for="categoryId">Expense Category <span class="required">*</span></label>
        <div class="select-wrapper">
          <select id="categoryId" formControlName="categoryId">
            <option [value]="null" disabled>Select a category</option>
            <option *ngFor="let cat of data.categories" [value]="cat.categoryId">
              {{ cat.name }}
            </option>
          </select>
          <mat-icon class="select-icon">expand_more</mat-icon>
        </div>
        <div class="error-msg" *ngIf="form.get('categoryId')?.touched && form.get('categoryId')?.hasError('required')">
          Please select a category
        </div>
      </div>

      <!-- Title -->
      <div class="form-group full-width">
        <label for="title">Expense Title <span class="required">*</span></label>
        <input id="title" type="text" formControlName="title" placeholder="e.g. Internet subscription" />
        <div class="error-msg" *ngIf="form.get('title')?.touched && form.get('title')?.hasError('required')">
          Title is required
        </div>
      </div>

      <!-- Description -->
      <div class="form-group full-width">
        <label for="description">Description</label>
        <textarea id="description" formControlName="description" rows="3" placeholder="Provide details about this recurring expense..."></textarea>
      </div>

      <!-- Amount -->
      <div class="form-group">
        <label for="amount">Amount <span class="required">*</span></label>
        <div class="input-with-icon">
          <mat-icon>payments</mat-icon>
          <input id="amount" type="number" formControlName="amount" placeholder="0.00" step="0.01" />
        </div>
        <div class="error-msg" *ngIf="form.get('amount')?.touched && (form.get('amount')?.hasError('required') || form.get('amount')?.hasError('min'))">
          Enter a valid amount (min 0.01)
        </div>
      </div>

      <!-- Rotation -->
      <div class="form-group">
        <label for="rotation">Rotation / Frequency <span class="required">*</span></label>
        <div class="select-wrapper">
          <select id="rotation" formControlName="rotation">
            <option value="" disabled>Select frequency</option>
            <option *ngFor="let opt of rotationOptions" [value]="opt.value">
              {{ opt.label }}
            </option>
          </select>
          <mat-icon class="select-icon">expand_more</mat-icon>
        </div>
        <div class="error-msg" *ngIf="form.get('rotation')?.touched && form.get('rotation')?.hasError('required')">
          Please select a rotation
        </div>
      </div>

      <!-- Day of Month -->
      <div class="form-group">
        <label for="dayOfMonth">Day of Month</label>
        <div class="input-with-icon">
          <mat-icon>event</mat-icon>
          <input id="dayOfMonth" type="text" formControlName="dayOfMonth" placeholder="e.g. 1st, 15th" />
        </div>
      </div>

      <!-- Merchant -->
      <div class="form-group">
        <label for="merchant">Merchant / Vendor</label>
        <div class="input-with-icon">
          <mat-icon>store</mat-icon>
          <input id="merchant" type="text" formControlName="merchant" placeholder="Vendor name" />
        </div>
      </div>

      <!-- Payment Method -->
      <div class="form-group full-width">
        <label for="paymentMethod">Payment Method</label>
        <div class="input-with-icon">
          <mat-icon>credit_card</mat-icon>
          <input id="paymentMethod" type="text" formControlName="paymentMethod" placeholder="e.g. Card, Direct Debit" />
        </div>
      </div>
    </div>
  </form>
</div>

<div class="dialog-footer">
  <button class="cancel-btn" (click)="onCancel()">Cancel</button>
  <button class="submit-btn" [disabled]="form.invalid || isSubmitting" (click)="onSubmit()">
    <ng-container *ngIf="isSubmitting; else normalBtn">
      <mat-spinner diameter="20"></mat-spinner>
      <span>{{ data.mode === 'create' ? 'Creating...' : 'Updating...' }}</span>
    </ng-container>
    <ng-template #normalBtn>
      <mat-icon>{{ data.mode === 'create' ? 'add' : 'check' }}</mat-icon>
      <span>{{ data.mode === 'create' ? 'Create Recurring' : 'Update Changes' }}</span>
    </ng-template>
  </button>
</div>
