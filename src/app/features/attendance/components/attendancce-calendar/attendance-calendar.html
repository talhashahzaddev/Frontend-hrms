<div class="calendar-wrapper">
  <!-- Header -->
  <div class="cal-header">
    <h3 class="cal-title">{{ currentMonthYear }}</h3>
    <div class="cal-nav">
      <button mat-icon-button (click)="previousMonth()" class="nav-btn">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-icon-button (click)="nextMonth()" class="nav-btn">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>

  <!-- Weekday Row -->
  <div class="weekday-row">
    <div class="weekday" *ngFor="let dayName of weekDays">{{ dayName }}</div>
  </div>

  <!-- Calendar Grid -->
  <div class="calendar-grid">
    <div
      *ngFor="let cell of daysGrid"
      class="cal-cell"
      [class.other-month]="!cell.inCurrentMonth"
      [class.is-today]="cell.isToday"
      [matTooltip]="getTooltip(cell)"
      matTooltipPosition="above"
    >
      <span class="day-number">
        {{ cell.date.getDate() }}
      </span>
      <span
        *ngIf="cell.inCurrentMonth"
        class="status-dot"
        [ngClass]="getStatusDotClass(cell)"
      ></span>
    </div>
  </div>

  <!-- Legend -->
  <div class="cal-legend">
    <div class="legend-item"><span class="dot dot-present"></span> Present</div>
    <div class="legend-item"><span class="dot dot-absent"></span> Absent</div>
    <div class="legend-item"><span class="dot dot-late"></span> Late</div>
    <div class="legend-item"><span class="dot dot-leave"></span> Leave</div>
    <div class="legend-item"><span class="dot dot-half"></span> Half Day</div>
  </div>
</div>
